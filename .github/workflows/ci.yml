name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Hadolint (Dockerfile lint)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < item-service/Dockerfile

      - name: Shellcheck (scripts)
        run: shellcheck scripts/backup.sh scripts/restore.sh

      - name: Validate docker-compose
        run: docker compose config --quiet

      - name: Validate Grafana dashboards (JSON)
        run: |
          shopt -s nullglob
          files=(monitoring/grafana/dashboards/*.json)
          if (( ${#files[@]} == 0 )); then
            echo "No Grafana dashboards found in monitoring/grafana/dashboards/"
            exit 1
          fi
          for f in "${files[@]}"; do
            jq empty "$f" && echo "OK: $f"
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build jar (skip tests)
        working-directory: item-service
        run: ./gradlew bootJar -x test

      - name: Upload jar artifact
        uses: actions/upload-artifact@v5
        with:
          name: item-service-jar
          path: item-service/build/libs/*.jar
          if-no-files-found: error

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        working-directory: item-service
        run: ./gradlew test

      - name: Publish test report (PR check)
        if: >-
          always() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: item-service/build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload test reports (HTML)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: item-service/build/reports/tests/

  docker-build:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: [ quality-checks, build, tests ]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download jar artifact
        uses: actions/download-artifact@v5
        with:
          name: item-service-jar
          path: item-service/build/libs

      - name: Build Docker image
        working-directory: item-service
        run: docker build -t item-service:test .

      - name: Smoke test (PostgreSQL + app)
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_DB=item_service -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres:17
          docker run -d --name smoke-app --network smoke -p 8080:8080 \
            -e DB_HOST=smoke-db -e DB_PORT=5432 -e DB_NAME=item_service \
            -e DB_USERNAME=postgres -e DB_PASSWORD=postgres \
            item-service:test
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | jq -e '.status == "UP"'; then
              echo "Smoke test OK: app is UP"
              docker stop smoke-app smoke-db
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test FAILED: app did not become healthy"
          docker logs smoke-app || true
          docker stop smoke-app smoke-db || true
          exit 1

      # main is protected: merges require an approved pull request.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: docker-metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Tag and publish smoke-tested image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAGS: ${{ steps.docker-metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag item-service:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
