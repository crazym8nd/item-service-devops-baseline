name: CD

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (release tag v1.2.3 or sha-<commit>)'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy-development:
    name: Deploy to Development (simulated)
    # Runs after a successful CI run on main. Never cancels an in-flight deploy:
    # per-environment concurrency with cancel-in-progress: false.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 5
    concurrency:
      group: cd-development
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image digest
        id: image
        env:
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')
          echo "reference=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Simulate deploy to development
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          echo "Deploying ${IMAGE} to development..."
          echo "Environment: development"
          echo "Deploy OK (simulated)"

  deploy-stage:
    name: Deploy to Stage (simulated, manual)
    # Deploys the explicitly selected, already-published image tag — CD never rebuilds.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: stage
    timeout-minutes: 5
    concurrency:
      group: cd-stage
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag and resolve image digest
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ && ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "image_tag must be sha-<40 lowercase hex characters> or v<major>.<minor>.<patch>; latest is not allowed."
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')
          echo "reference=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Simulate deploy to stage
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          echo "Deploying ${IMAGE} to stage..."
          echo "Environment: stage"
          echo "Deploy OK (simulated)"

  deploy-production:
    name: Deploy to Production (simulated, manual)
    # Deploys the explicitly selected, already-published image tag — CD never rebuilds.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: cd-production
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag and resolve image digest
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ && ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "image_tag must be sha-<40 lowercase hex characters> or v<major>.<minor>.<patch>; latest is not allowed."
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')
          echo "reference=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Simulate deploy to production
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          echo "Deploying ${IMAGE} to production..."
          echo "Environment: production"
          echo "Deploy OK (simulated)"
